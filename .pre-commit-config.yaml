repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # pragma: allowlist secret (public hook commit)
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run --all-packages ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: Ruff check
        entry: uv run --all-packages ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --all-packages mypy .
        language: system
        pass_filenames: false
        types: [python]
      - id: detect-secrets
        name: detect-secrets
        entry: uv run --all-packages detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
        exclude: ^\.secrets\.baseline$
